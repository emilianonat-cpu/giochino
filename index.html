<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d1640">
<meta property="og:title" content="Corri tra i Grattacieli">
<meta property="og:description" content="Il gioco di corse e salti tra Abu Dhabi e Ronciglione">
</head>
<body>
<title>Corri tra i Grattacieli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&display=swap">
<style>
/* Layout: full-screen canvas game; HTML overlays for welcome, home, map, character shop, stables, intro, pause and end screens */
:root{
  --night:#1d1640; --cream:#fff7e8; --sun:#ffc23d; --coral:#ff6b4a; --teal:#22b8a7;
  --font:"Baloo Bhaijaan 2", "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--night);overflow:hidden;overscroll-behavior:none}
body{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:var(--font);color:var(--cream)}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:min(2.4vh,18px);padding-inline:16px;padding-block:10px;text-align:center;
  background:linear-gradient(180deg,rgba(29,22,64,.6),rgba(29,22,64,.2) 55%,rgba(29,22,64,.5));overflow-y:auto;touch-action:pan-y}
.dim{background:rgba(29,22,64,.78)}
h1,.big{margin:0;font-weight:800;line-height:1;letter-spacing:.01em;text-wrap:balance;color:var(--sun);text-shadow:0 4px 0 var(--coral),0 8px 0 rgba(0,0,0,.25)}
h1{font-size:clamp(36px,10vmin,90px)}
.big{font-size:clamp(32px,9vmin,84px)}
h2{margin:0;font-weight:800;font-size:clamp(20px,5.2vmin,38px);text-shadow:0 3px 0 rgba(0,0,0,.3)}
.sub{font-weight:600;font-size:clamp(14px,3.4vmin,24px);opacity:.95;max-width:60ch}
button{font-family:inherit;touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent;color:inherit}
button:focus-visible,input:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.row{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:10px;padding:8px 24px;border-radius:999px;border:4px solid var(--cream);background:var(--coral);
  font-weight:800;font-size:clamp(18px,4.8vmin,32px);box-shadow:0 6px 0 rgba(0,0,0,.3);transition:transform .1s}
.pill.alt{background:var(--teal)}
.pill svg{width:1em;height:1em}
.pill:active,.btn:active,.lv:active,.card:active{transform:translateY(4px)}
.btn{width:clamp(54px,12vmin,88px);aspect-ratio:1;border-radius:50%;border:4px solid var(--cream);background:rgba(255,255,255,.16);display:grid;place-items:center;
  box-shadow:0 6px 0 rgba(0,0,0,.3);transition:transform .1s;padding:0}
.btn.go{width:clamp(72px,16vmin,120px);background:var(--coral)}
.btn svg{width:48%;height:48%}
.btn.off{opacity:.45}
.corner{position:fixed;top:max(10px,env(safe-area-inset-top,0px));width:52px;z-index:2}
.corner.l{left:12px}.corner.r{right:12px}
.bank{position:fixed;top:max(14px,env(safe-area-inset-top,0px));right:16px;z-index:2;padding:4px 14px;border-radius:999px;background:rgba(20,12,50,.6);border:3px solid var(--sun);font-weight:800;font-size:20px;color:var(--sun);font-variant-numeric:tabular-nums}
.levels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:min(2vw,14px);width:min(100%,940px)}
@media (orientation:portrait){.levels{grid-template-columns:repeat(3,minmax(0,1fr));width:min(100%,480px)}}
.lv{position:relative;padding:0;border:4px solid var(--cream);border-radius:16px;overflow:hidden;background:#000;box-shadow:0 5px 0 rgba(0,0,0,.3);transition:transform .1s;min-width:0}
.lv canvas{display:block;width:100%;aspect-ratio:16/10;max-width:100%}
.lv .n{position:absolute;top:5px;left:6px;width:1.6em;height:1.6em;border-radius:50%;background:var(--sun);color:var(--night);display:grid;place-items:center;font-weight:800;font-size:clamp(11px,2.6vmin,18px)}
.lv .x{position:absolute;top:5px;left:6px;padding:0 8px;height:1.6em;border-radius:999px;background:#ff5fa2;color:#fff;display:grid;place-items:center;font-weight:800;font-size:clamp(10px,2.3vmin,15px)}
.lv .nm{position:absolute;left:0;right:0;bottom:0;padding:12px 4px 2px;font-weight:800;font-size:clamp(11px,2.6vmin,18px);color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.72));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv .st{position:absolute;top:4px;right:6px;font-size:clamp(10px,2.4vmin,17px);letter-spacing:1px;color:var(--sun);text-shadow:0 2px 0 rgba(0,0,0,.6)}
.lv .st i{font-style:normal;color:rgba(255,255,255,.35)}
.lv.locked canvas{filter:grayscale(1) brightness(.45)}
.lv .lock{position:absolute;inset:0;display:grid;place-items:center}
.lv .lock svg{width:30%;max-width:50px}
.custom{display:flex;gap:min(3vw,24px);align-items:center;justify-content:center;width:min(100%,960px);flex-wrap:wrap}
#avCanvas{width:min(30vw,220px,44vh);aspect-ratio:3/4;max-width:100%;background:rgba(255,255,255,.12);border-radius:22px;border:4px solid var(--cream);flex:none}
.opts{display:flex;flex-direction:column;gap:8px;align-items:center;min-width:0;flex:1 1 300px;max-width:560px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tab{width:clamp(40px,9vmin,54px);aspect-ratio:1;border-radius:14px;border:3px solid rgba(255,255,255,.4);background:rgba(255,255,255,.1);display:grid;place-items:center;padding:0}
.tab.on{border-color:var(--sun);background:rgba(255,194,61,.25)}
.tab svg{width:62%;height:62%}
.panel{display:flex;flex-direction:column;gap:8px;align-items:center;min-height:120px}
.optrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ob{position:relative;width:clamp(48px,11vmin,64px);aspect-ratio:1;border-radius:14px;border:3px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);padding:0;display:grid;place-items:center;overflow:hidden}
.ob canvas{width:100%;height:100%}
.ob.on{border-color:var(--sun);box-shadow:0 0 0 3px var(--sun)}
.ob .cost{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;background:rgba(20,12,50,.55);font-weight:800;font-size:13px;color:var(--sun);padding-bottom:2px}
.sw{width:clamp(34px,7.5vmin,46px);aspect-ratio:1;border-radius:50%;border:3px solid rgba(255,255,255,.5);padding:0;background:var(--c,#fff)}
.sw.on{border-color:var(--sun);box-shadow:0 0 0 3px var(--sun)}
.rec{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.recb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 10px;border-radius:16px;background:rgba(255,255,255,.1);border:3px solid rgba(255,255,255,.35);min-width:92px}
.recb .lbl{font-weight:800;font-size:14px}
.recb .bb{display:flex;gap:6px}
.mini{width:40px;height:40px;border-radius:50%;border:3px solid var(--cream);background:var(--coral);display:grid;place-items:center;padding:0}
.mini.play{background:var(--teal)}
.mini.recording{animation:pulse .6s infinite alternate}
.mini svg{width:55%;height:55%}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.15)}}
.note{font-size:13px;opacity:.8;max-width:46ch}
#nameIn,#welName{font:800 clamp(18px,4.4vmin,28px) var(--font);padding:6px 16px;border-radius:14px;border:3px solid var(--cream);background:rgba(255,255,255,.95);color:var(--night);width:min(64vw,260px);text-align:center;user-select:text;-webkit-user-select:text}
.parent{font:600 13px var(--font);background:none;border:0;color:rgba(255,247,232,.65);text-decoration:underline;padding:4px}
.kids{display:flex;gap:18px}
.card{padding:0;border:4px solid var(--cream);border-radius:20px;background:rgba(255,255,255,.12);box-shadow:0 6px 0 rgba(0,0,0,.3);transition:transform .1s;display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:18px;overflow:hidden}
.card canvas{width:clamp(80px,18vmin,130px);aspect-ratio:3/4}
.card.on{border-color:var(--sun);box-shadow:0 0 0 4px var(--sun),0 6px 0 rgba(0,0,0,.3)}
.card span{padding:2px 0 6px}
.stables{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;width:min(100%,900px)}
@media (orientation:portrait){.stables{grid-template-columns:repeat(3,minmax(0,1fr))}}
.stables .card canvas{width:100%;aspect-ratio:4/3}
.stables .card span{font-size:clamp(13px,3vmin,20px)}
.power{display:flex;align-items:center;gap:16px;background:rgba(255,255,255,.14);border:3px solid rgba(255,255,255,.5);border-radius:22px;padding:10px 22px;max-width:100%}
.power canvas{width:clamp(64px,15vmin,110px);height:clamp(64px,15vmin,110px);flex:none}
.power .t{text-align:left;min-width:0}
.stars{display:flex;gap:10px}
.stars svg{width:clamp(44px,11vmin,90px);height:auto}
.stars svg path{fill:rgba(255,255,255,.18);stroke:rgba(255,255,255,.45);stroke-width:3}
.stars svg.on path{fill:var(--sun);stroke:#e08a00}
.stars svg.on{animation:pop .5s cubic-bezier(.3,1.8,.5,1) both}
.stars svg:nth-child(2).on{animation-delay:.2s}.stars svg:nth-child(3).on{animation-delay:.4s}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.score{font-weight:800;font-size:clamp(22px,5.6vmin,44px);font-variant-numeric:tabular-nums}
.rotico svg{width:64px;height:64px;animation:tilt 2.4s ease-in-out infinite}
@keyframes tilt{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (prefers-reduced-motion:reduce){.rotico svg,.stars svg.on,.mini.recording{animation:none}}
</style>

<canvas id="game" aria-label="Gioco: tocca per saltare, tieni premuto per saltare più in alto"></canvas>

<div id="welcome" class="overlay dim" hidden>
  <h2>Ciao! Come ti chiami?</h2>
  <input id="welName" maxlength="12" placeholder="Il tuo nome" autocomplete="off" aria-label="Il tuo nome">
  <div class="kids">
    <button class="card" data-kind="0"><canvas width="130" height="173"></canvas><span>Bimbo</span></button>
    <button class="card" data-kind="1"><canvas width="130" height="173"></canvas><span>Bimba</span></button>
  </div>
  <button class="btn go" id="welGo" aria-label="Fatto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg></button>
</div>

<div id="home" class="overlay" hidden>
  <button class="btn corner r" id="bFull" aria-label="Schermo intero"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <h1 id="title">Corri, corri!</h1>
  <div class="row">
    <button class="pill" id="bPlay"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3l15 9-15 9z"/></svg>Gioca</button>
    <button class="pill alt" id="bChar"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="7" r="5"/><path d="M3 22c1-6 5-8 9-8s8 2 9 8z"/></svg>Personaggio</button>
  </div>
  <div class="sub" id="homeBank"></div>
</div>

<div id="map" class="overlay dim" hidden>
  <button class="btn corner l" id="mapBack" aria-label="Indietro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4l-8 8 8 8"/></svg></button>
  <h2>Scegli il livello</h2>
  <div class="levels" id="levels"></div>
</div>

<div id="custom" class="overlay dim" hidden>
  <button class="btn corner l" id="custBack" aria-label="Fatto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4l-8 8 8 8"/></svg></button>
  <div class="bank" id="custBank">★ 0</div>
  <div class="custom">
    <canvas id="avCanvas" width="220" height="293"></canvas>
    <div class="opts">
      <input id="nameIn" maxlength="12" placeholder="Il tuo nome" autocomplete="off" aria-label="Nome">
      <div class="tabs" id="tabs"></div>
      <div class="panel" id="panel"></div>
      <button class="parent" id="unlockAll">Per i grandi: sblocca tutto</button>
    </div>
  </div>
</div>

<div id="stable" class="overlay dim" hidden>
  <button class="btn corner l" id="stBack" aria-label="Indietro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4l-8 8 8 8"/></svg></button>
  <h2>Scegli la tua scuderia</h2>
  <div class="stables" id="stables"></div>
</div>

<div id="intro" class="overlay dim" hidden>
  <div class="sub" id="introNum">Livello 1</div>
  <div class="big" id="introName">Abu Dhabi</div>
  <div class="power">
    <canvas id="powIcon" width="110" height="110"></canvas>
    <div class="t"><h2 id="powTitle">Nuovo potere!</h2><div class="sub" id="powHint"></div></div>
  </div>
  <button class="btn go" id="introGo" aria-label="Via"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3l15 9-15 9z"/></svg></button>
</div>

<div id="rotate" class="overlay dim" hidden>
  <div class="rotico"><svg viewBox="0 0 24 24" fill="none" stroke="#fff7e8" stroke-width="2" stroke-linecap="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg></div>
  <h2>Gira il telefono!</h2>
  <button class="pill alt" id="rotOk">Ok</button>
</div>

<div id="pause" class="overlay dim" hidden>
  <h2>Pausa</h2>
  <div class="row">
    <button class="btn" id="pMap" aria-label="Livelli"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg></button>
    <button class="btn go" id="pResume" aria-label="Continua"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3l15 9-15 9z"/></svg></button>
    <button class="btn" id="pMusic" aria-label="Musica"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 18V5l12-2v13" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></button>
    <button class="btn" id="pSfx" aria-label="Suoni"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9h4l6-5v16l-6-5H3z"/><path d="M16 8a5 5 0 0 1 0 8M19 5a9 9 0 0 1 0 14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg></button>
    <button class="btn" id="pFull" aria-label="Schermo intero"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
</div>

<div id="done" class="overlay" hidden>
  <div class="big" id="doneTitle">Bravo!</div>
  <div class="sub" id="doneSub">Well done! · <span lang="ar" dir="rtl">أحسنت!</span></div>
  <div class="stars" id="stars">
    <svg viewBox="0 0 50 48"><path d="M25 3l6.5 14 15 1.6-11.3 10 3.3 15L25 36l-13.5 7.6 3.3-15L3.5 18.6l15-1.6z" stroke-linejoin="round"/></svg>
    <svg viewBox="0 0 50 48"><path d="M25 3l6.5 14 15 1.6-11.3 10 3.3 15L25 36l-13.5 7.6 3.3-15L3.5 18.6l15-1.6z" stroke-linejoin="round"/></svg>
    <svg viewBox="0 0 50 48"><path d="M25 3l6.5 14 15 1.6-11.3 10 3.3 15L25 36l-13.5 7.6 3.3-15L3.5 18.6l15-1.6z" stroke-linejoin="round"/></svg>
  </div>
  <div class="score" id="scoreLine">★ 0</div>
  <div class="row">
    <button class="btn" id="dMap" aria-label="Livelli"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg></button>
    <button class="btn" id="dAgain" aria-label="Rigioca"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 3v5h-5" stroke-linejoin="round"/></svg></button>
    <button class="btn go" id="dNext" aria-label="Prossimo livello"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3l15 9-15 9z"/></svg></button>
  </div>
</div>

<script>
"use strict";
const FONT = '"Baloo Bhaijaan 2", "Baloo 2", "Trebuchet MS", system-ui, sans-serif';
const cv = document.getElementById('game');
let ctx = cv.getContext('2d');
const VH = 540;
let DPR = 1, CW = 0, CH = 0, S = 1, VW = 960, OY = 0;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  CW = innerWidth; CH = innerHeight;
  cv.width = Math.round(CW*DPR); cv.height = Math.round(CH*DPR);
  S = CH/VH; VW = CW/S; OY = 0;
  if (VW < 700){ S = CW/700; VW = 700; OY = (CH - VH*S)/2; }
}
addEventListener('resize', resize); resize();

const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hash(a){ a|=0; a=Math.imul(a^(a>>>16),0x45d9f3b); a=Math.imul(a^(a>>>16),0x45d9f3b); a^=a>>>16; return (a>>>0)/4294967296; }
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));

// ---------- avatar & shop ----------
const SKINS = ['#f7d7bd','#e8b88a','#c68a5c','#a86b43','#7a4a2c'];
const HAIRC = ['#3b2416','#17171c','#a0522d','#e2b64e','#ff7eb6','#3a86ff'];
const COLORS = ['#ff6b4a','#3a86ff','#22b8a7','#ffbe0b','#8f6bff','#ff5fa2','#2b2d42','#f4f4f4'];
const OUTFITS = [{id:'tee',cost:0},{id:'soccer',cost:0},{id:'hero',cost:40},{id:'pirate',cost:60},{id:'astro',cost:80},{id:'dino',cost:100}];
const HATS = [{id:'none',cost:0},{id:'cap',cost:0},{id:'glasses',cost:0},{id:'phones',cost:30},{id:'sun',cost:20},{id:'crown',cost:60}];
const PETS = [{id:'none',cost:0},{id:'dog',cost:0},{id:'cat',cost:0},{id:'falcon',cost:40},{id:'camel',cost:60},{id:'pony',cost:60},{id:'dino',cost:90}];
let AV = Object.assign({kind:0, skin:1, hair:0, hairC:0, outfit:0, color:0, hat:0, pet:1, name:''}, store.get('corri3-avatar', {}));
let owned = new Set(store.get('corri3-owned', []));
let bank = store.get('corri3-bank', 0);
const hasItem = (cat, i, list)=> list[i].cost === 0 || owned.has(cat+':'+i);
function saveAV(){ store.set('corri3-avatar', AV); }
try { const h = decodeURIComponent(location.hash.slice(1)).replace(/[^A-Za-z]/g,'').slice(0,12); if (h && !AV.name) AV.name = h[0].toUpperCase()+h.slice(1).toLowerCase(); } catch(e){}

// ---------- levels ----------
const POWERS = {
  shoes:{dur:12, name:'Scarpe da parkour', hint:'Tocca di nuovo in aria: doppio salto!'},
  lego:{dur:12, name:'Mattoncini LEGO', hint:'Tutto diventa LEGO! Costruisci ponti e le stelle valgono doppio.'},
  blocks:{dur:12, name:'Mondo Minecraft', hint:'Tutto diventa a cubetti! Costruisci ponti e rompi gli ostacoli.'},
  truck:{dur:8, name:'Monster truck', hint:'Sfonda tutti gli ostacoli!'},
  piano:{dur:12, name:'Pianola magica', hint:'Fa apparire i tasti per attraversare!'},
  fly:{dur:7, name:'Super volo', hint:'Tieni premuto il dito per volare!'}
};
const LEVELS = [
  {name:'Abu Dhabi', theme:'city', pow:'shoes', speed:285, length:6800},
  {name:'La scuola', theme:'school', pow:'lego', speed:295, length:7200},
  {name:'Bebè', theme:'nursery', pow:null, speed:235, length:5600, baby:true, extra:true},
  {name:'Il deserto', theme:'desert', pow:'blocks', speed:305, length:7600},
  {name:'Ronciglione', theme:'town', pow:'piano', speed:315, length:8000},
  {name:'Corsa a vuoto', type:'race', theme:'town', extra:true},

      else if (inGame && pow.piano>0) osc(musGain, mf(m), 0.45, 'triangle', 0.16, w);
      else if (inGame && pow.fly>0){ osc(musGain, mf(m+12), 0.2, 'square', 0.05, w); osc(musGain, mf(m+19), 0.15, 'sine', 0.04, w); }
      else if (inGame && pow.blocks>0){ osc(musGain, mf(m), step*0.6, 'square', 0.07, w); }
      else osc(musGain, mf(m), step*0.9, 'square', 0.05, w);
    }
    if (b) osc(musGain, mf(b), step*1.4, inGame && pow.truck>0 ? 'sawtooth' : 'triangle', inGame && pow.truck>0 ? 0.12 : (song.box ? 0.09 : 0.16), w);
    if (!song.box){
      if (song.drum==='dar'){ if (i%8===0 || i%8===3) osc(musGain, 140, 0.15, 'sine', 0.35, w, 50); if (i%8===6) noiseAt(musGain, w, 0.08, 0.18, 2000); }
      else { if (i%4===0) osc(musGain, 150, 0.15, 'sine', 0.38, w, 45); if (i%4===2) noiseAt(musGain, w, 0.1, 0.15, 1500); }
      if (i%2===1) noiseAt(musGain, w, 0.03, 0.06, 6000);
    }
    mNext += step; mStep++;
  }
}

// ---------- recorded voice (kept on this device only) ----------
const VOICE_SLOTS = [
  {k:'start', lbl:'Via!'},
  {k:'power', lbl:'Potere'},
  {k:'ouch', lbl:'Ahia'},
  {k:'win', lbl:'Vittoria'}
];
const VOICES = {}; let voiceT = 0;
function idb(){ return new Promise((res, rej)=>{ try { const q = indexedDB.open('corri3-voice', 1); q.onupgradeneeded = ()=>q.result.createObjectStore('v'); q.onsuccess = ()=>res(q.result); q.onerror = ()=>rej(q.error); } catch(e){ rej(e); } }); }
async function voicePut(k, blob){ try { const db = await idb(); db.transaction('v','readwrite').objectStore('v').put(blob, k); } catch(e){} }
async function voiceDel(k){ try { const db = await idb(); db.transaction('v','readwrite').objectStore('v').delete(k); } catch(e){} }
async function voiceLoadAll(){
  try { const db = await idb(); for (const s of VOICE_SLOTS){ await new Promise(res=>{ const q = db.transaction('v').objectStore('v').get(s.k); q.onsuccess = ()=>{ if (q.result) VOICES[s.k] = q.result; res(); }; q.onerror = ()=>res(); }); } } catch(e){}
}
const voiceUrls = {};
function playBlob(blob){ try { const u = URL.createObjectURL(blob); const a = new Audio(u); a.volume = 1; a.play().catch(()=>{}); a.onended = ()=>URL.revokeObjectURL(u); } catch(e){} }
function say(k){
  if (!VOICES[k] || state==='attract' || !sfxOn) return false;
  if (t - voiceT < 1.2) return false;
  voiceT = t; playBlob(VOICES[k]); return true;
}
let recorder = null;
async function recordSlot(k, btn, onDone){
  if (recorder){ recorder.stop(); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){ onDone(false); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({audio:true}); } catch(e){ onDone(false); return; }
  const chunks = [];
  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = e=>{ if (e.data.size) chunks.push(e.data); };
  recorder.onstop = ()=>{ stream.getTracks().forEach(tr=>tr.stop()); recorder = null; btn.classList.remove('recording'); if (chunks.length){ const b = new Blob(chunks, {type:chunks[0].type}); VOICES[k] = b; voicePut(k, b); playBlob(b); } onDone(true); };
  recorder.start(); btn.classList.add('recording');
  setTimeout(()=>{ if (recorder && recorder.state==='recording') recorder.stop(); }, 2500);
}

// ---------- gameplay ----------
function solid(p){ return !p.ghost || pow.piano > 0; }
function platUnder(x){ let best=null; for (const p of L.plats) if (solid(p) && x>=p.x && x<=p.x+p.w && (!best || p.y<best.y)) best=p; return best; }
function doJump(){
  const truck = pow.truck > 0, baby = LEVELS[curLi].baby;
  if (pow.fly > 0 && !P.ground) return true;
  if (P.ground || P.coyote > 0){
    P.vy = truck ? -800 : baby ? -780 : -840; P.ground = false; P.on = null; P.coyote = 0; P.jumps = pow.shoes>0 ? 1 : 0; P.holdT = 0; P.sq = 1.25;
    sfx.jump(); if (pow.piano>0) pianoKey(FRA[pianoIdx++%FRA.length]);
    dust(P.x, P.y, 5); return true;
  }
  if (P.jumps > 0){
    P.jumps--; P.vy = -790; P.spin = 0.001; P.holdT = 0; sfx.jump2();

}
function dust(x,y,n){ for (let i=0;i<n;i++) parts.push({x:x-6, y, vx:-Math.random()*140, vy:-Math.random()*80, life:0.4, max:0.4, c:'rgba(255,255,255,.75)', sz:5+Math.random()*4, k:'dot'}); }
function burst(x,y,n,spd,cols){ cols = cols || ['#ffd23f','#ff6b4a','#fff','#22b8a7']; for (let i=0;i<n;i++){ const a=i/n*Math.PI*2; parts.push({x, y, vx:Math.cos(a)*spd, vy:Math.sin(a)*spd, life:0.6, max:0.6, c:cols[i%cols.length], sz:5, k:'spark'}); } }
function cubes(x,y,n,cols){ for (let i=0;i<n;i++) parts.push({x, y, vx:(Math.random()-0.3)*420, vy:-Math.random()*520, life:0.8, max:0.8, c:cols[i%cols.length], sz:7, k:'cube'}); }
function pop(text, col){ pops.push({x:P.x, y:P.y-100, text, life:1.1, col:col||'#ffd23f'}); }
function hurt(){

function respawnFromCheckpoint(){

  for (const pw of L.pows) if (pw.x > x0) pw.taken = false;

function smashObst(o, ox, oy, kind){

  if (kind==='mc') cubes(ox, oy-20, 14, ['#8f5d36','#6dbb3c','#7a7a7a','#a77044']);

}
const COMBO_WORDS = ['Super!','Wow!','Yalla!','Grande!','Bravo!','Amazing!','Forte!'];
function collectItem(it){

  for (let i=0;i<6;i++){ const a=i/6*Math.PI*2; parts.push({x:it.x, y:it.y, vx:Math.cos(a)*160, vy:Math.sin(a)*160, life:0.4, max:0.4, c:'#ffe27a', sz:4, k:'spark'}); }

function update(dt){
  t += dt;
  if (state==='race' || state==='racedone'){ updateRace(dt); return; }
  if (state==='intro' || state==='paused' || state==='stable') return;
  if (state==='oops'){ oopsT += dt; updateParts(dt); if (oopsT > 1.7) respawnFromCheckpoint(); return; }
  levelT += dt;
  for (const k in pow){ const before = pow[k]; pow[k] = Math.max(0, pow[k]-dt); if (before>0 && pow[k]===0 && k==='truck') dust(P.x,P.y,12); }
  const st = curStyle();
  if (st !== lastStyle){ flash = 0.35; lastStyle = st; if (state!=='attract') sfx.poof(); burst(P.x, P.y-30, 24, 300, st==='mc' ? ['#6dbb3c','#8f5d36','#7a7a7a'] : st==='lego' ? ['#e3000b','#0055bf','#ffd500','#00852b'] : ['#fff','#ffd23f']); }
  flash = Math.max(0, flash - dt);
  P.inv = Math.max(0, P.inv-dt);
  if (P.spin > 0){ P.spin += dt*13; if (P.spin >= Math.PI*2) P.spin = 0; }
  P.sq += (1-P.sq)*Math.min(1, dt*12);
  comboT -= dt; if (comboT <= 0) combo = 0;
  shake = Math.max(0, shake - dt*30);
  const LV = LEVELS[curLi], truck = pow.truck > 0, fly = pow.fly > 0;
  let target = LV.speed * (truck ? 1.12 : 1);
  if (state==='done') target = P.x > L.fin.x + L.fin.w - 450 ? 0 : LV.speed*0.8;
  P.sp += (target - P.sp) * Math.min(1, dt*(target < P.sp ? 6 : 2.2));
  const sp = P.sp;

  if (state==='attract'){
    if (P.ground){
      const p = platUnder(P.x + sp*0.12 + 12);
      const o = L.obst.find(o=>!o.hit && o.x+o.mx>P.x && o.x+o.mx-P.x<80);
      if (!p || p.y < P.y-4 || (o && !truck && pow.blocks<=0)){ P.buf = 0.1; holding = true; }
    } else if (P.vy > 0) holding = false;
    if (fly) holding = P.y > 300;
  }
  if (P.buf > 0){ if (doJump()) P.buf = 0; else P.buf -= dt; }

  const hw = truck ? 34 : 10, ph = truck ? 72 : (LV.baby ? 40 : 60);
  const prevX = P.x; P.x += sp*dt;
  for (const p of L.plats) if (p.bob) p.y = p.y0 + Math.sin(t*2 + p.ph)*p.bob;
  const builds = pow.blocks>0 || pow.lego>0;
  for (const p of L.plats){
    if (!solid(p)) continue;
    if (P.y > p.y+8 && prevX+hw <= p.x+1 && P.x+hw > p.x){
      P.x = p.x - hw;
      if (builds && P.ground){ P.vy = -840; P.ground = false; P.on = null; sfx.block(); }
    }
  }
  if (P.ground){
    let sup = null;
    if (P.on && solid(P.on) && P.x+hw >= P.on.x && P.x-hw <= P.on.x+P.on.w) sup = P.on;
    else for (const p of L.plats){ if (solid(p) && P.x+hw >= p.x && P.x-hw <= p.x+p.w && Math.abs(p.y-P.y) < 14){ sup = p; break; } }
    if (!sup && builds) sup = addBlock();
    if (sup){ P.y = sup.y; P.vy = 0; P.on = sup; P.lastGY = sup.y; P.jumps = pow.shoes>0 ? 1 : 0; }
    else { P.ground = false; P.on = null; P.coyote = 0.11; }
  }
  // springs
  if (P.ground){
    for (const s of L.springs){ if (Math.abs(P.x - s.x) < 20 && Math.abs(P.y - s.y) < 2){ P.vy = -1180; P.ground = false; P.on = null; P.sq = 1.4; s.t = t; sfx.boing(); burst(s.x, s.y-10, 8, 150); break; } }
  }
  if (!P.ground){
    P.coyote = Math.max(0, P.coyote - dt);
    let g;
    if (fly){ if (holding){ P.vy -= 2700*dt; if (P.vy < -430) P.vy = -430; g = 0; } else g = 1000; }
    else if (P.balloon) g = 500;
    else if (P.vy < 0){ P.holdT += dt; g = (holding && P.holdT < 0.28) ? 1500 : 4200; }
    else g = 2700;
    P.vy += g*dt;
    if (fly && !holding && P.vy > 230) P.vy = 230;
    if (P.balloon && P.vy > 140) P.vy = 140;
    if (P.vy > 1150) P.vy = 1150;
    let ny = P.y + P.vy*dt;
    if (fly && ny < 80){ ny = 80; P.vy = 0; }
    let land = null;
    for (const p of L.plats){
      if (!solid(p) || P.x+hw < p.x || P.x-hw > p.x+p.w) continue;
      if (P.vy >= 0 && P.y <= p.y+6 && ny >= p.y && (!land || p.y < land.y)) land = p;
    }
    if (!land && builds && P.vy>=0 && P.y <= P.lastGY+1 && ny >= P.lastGY) land = addBlock();
    if (land){
      ny = land.y;
      dust(P.x, ny, truck?10:4); P.sq = 0.72;
      if (P.balloon) P.balloon = false;
      if (truck) shake = 6;
      if (land.ghost && state!=='attract'){ pianoKey(FRA[pianoIdx++%FRA.length]); land.lit = t; }
      P.ground = true; P.on = land; P.vy = 0; P.lastGY = ny; P.jumps = pow.shoes>0 ? 1 : 0;
    }
    P.y = ny;
  }
  const inLake = L.themeAt(P.x)==='lake', limit = inLake ? 480 : 640;
  if (P.y > limit){
    if (inLake) for (let i=0;i<14;i++) parts.push({x:P.x, y:478, vx:(Math.random()-0.5)*300, vy:-Math.random()*500, life:0.8, max:0.8, c:'#bfe6ff', sz:5, k:'chunk'});
    const p = L.plats.find(p=>!p.brick && !p.ghost && p.x+p.w > P.x+90);
    if (p && p.x > P.x) P.x = p.x + 30;
    P.y = (p ? p.y : 400) - 340; P.vy = 0; P.balloon = true; P.ground = false; P.on = null;
    sfx.balloon(); if (state==='play') hurt();
    if (state==='oops') return;
  }
  for (const o of L.obst){
    if (o.hit){ o.x += o.vx*dt; o.dy += o.vy*dt; o.vy += 1800*dt; o.rot += dt*9; continue; }
    if (o.roll && o.x - P.x < VW){ const nx = o.x - 70*dt, pl = platUnder(nx); if (pl && Math.abs(pl.y - o.y) < 3){ o.x = nx; o.rot -= dt*4; } }
    o.mx = o.walk ? Math.sin(t*1.6 + o.ph)*o.walk : 0;
    if (o.walk && !platUnder(o.x + o.mx)) o.mx = 0;
    o.my = o.hop ? -Math.abs(Math.sin(t*2.6 + o.ph))*70 : 0;
    const ox = o.x + o.mx, oy = o.y + o.my;
    if (Math.abs(ox - P.x) < hw+14 && P.y > oy-34 && P.y-ph+8 < oy){
      if (truck) smashObst(o, ox, oy, 'n');
      else if (pow.blocks>0) smashObst(o, ox, oy, 'mc');
      else if (P.vy > 150 && P.y < oy-14 && o.t!=='knight'){
        P.vy = -620; P.ground = false; P.on = null; o.hit = true; o.vx = 200; o.vy = -300; sfx.jump2(); count++; burst(ox, oy-20, 8, 160);
      } else if (state==='attract'){ o.hit = true; o.vx = 260; o.vy = -520; }
      else if (P.inv <= 0){ o.hit = true; o.vx = 260; o.vy = -520; hurt(); }
    }
  }
  for (const f of L.friends){
    f.t += dt;
    if (!f.done && Math.abs(f.x - P.x) < 30 && Math.abs(f.y - P.y) < 80){
      f.done = true; f.t = 0; count += 3; sfx.hi(); burst(f.x, f.y-50, 10, 180);
      bubbles.push({x:f.x, y:f.y-(f.baby?70:95), text:(f.baby?BABY:GREETS)[f.gi], life:1.6});
    }
  }
  // pet follows and helps
  if (pet && AV.pet){
    const tx = P.x - 62;
    pet.x += (tx - pet.x)*Math.min(1, dt*8);
    if (PETS[AV.pet].id === 'falcon'){ pet.y += ((P.y - 95 + Math.sin(t*3)*10) - pet.y)*Math.min(1, dt*5); }
    else {
      const pl = platUnder(pet.x); const gy = pl ? pl.y : P.y;
      pet.vy += 2400*dt; pet.y += pet.vy*dt;
      if (pet.y >= gy && pet.vy >= 0 && Math.abs(pet.y - gy) < 60){ pet.y = gy; pet.vy = P.sp > 30 ? -260 : 0; }
      if (pet.y > gy + 60 || Math.abs(pet.y - P.y) > 300){ pet.y = P.y; pet.vy = 0; }
    }
    for (const it of L.items){ if (!it.taken && Math.abs(it.x - pet.x) < 34 && Math.abs(it.y - (pet.y-20)) < 50) collectItem(it); }
  }
  const cx = P.x, cy = P.y - ph/2, rad = truck ? 52 : 36;
  for (const it of L.items){
    if (it.taken || Math.abs(it.x-cx) > rad+10) continue;
    if (Math.hypot(it.x-cx, it.y-cy) < rad) collectItem(it);
  }
  for (const pw of L.pows){
    if (pw.taken) continue;
    if (Math.hypot(pw.x-cx, pw.y-cy) < rad+22){
      pw.taken = true;
      let k = pw.t;
      if (k==='egg'){ const opts = (LEVELS[curLi].theme==='mix') ? ['shoes','lego','blocks','truck','piano','fly'] : unlockedPows(curLi); k = opts[Math.floor(Math.random()*opts.length)]; cubes(pw.x, pw.y, 10, ['#fff','#ffd23f','#ff5fa2']); }
      pow[k] = POWERS[k].dur; banner = {t:k, time:0};
      sfx.power(); if (k==='truck') sfx.vroom();
      if (!say('power')) pop(POWERS[k].name.split(' ')[0] + '!', '#fff');
      if (k==='shoes' && !P.ground) P.jumps = 1;
      burst(pw.x, pw.y, 20, 260);
    }
  }
  if (pow.shoes>0 && Math.random()<0.5) parts.push({x:P.x-8, y:P.y-4, vx:-60, vy:-20, life:0.5, max:0.5, c:['#ffd23f','#7cf','#f8a'][Math.floor(Math.random()*3)], sz:3, k:'spark'});
  if (pow.piano>0 && Math.random()<0.06) parts.push({x:P.x-10, y:P.y-60, vx:-40, vy:-60, life:1.2, max:1.2, c:'#fff', sz:22, k:'note'});
  if (fly && Math.random()<0.6) parts.push({x:P.x-20, y:P.y-30, vx:-120, vy:(Math.random()-0.5)*40, life:0.5, max:0.5, c:['#ffd23f','#fff','#ff6b4a'][Math.floor(Math.random()*3)], sz:3, k:'spark'});

  P.anim += sp*dt*(LV.baby ? 0.07 : 0.05);
  camX += ((P.x - VW*0.3) - camX) * Math.min(1, dt*6);

  if (state==='play' && !cpReached && P.x >= L.checkX){ cpReached = true; cpCount = count; sfx.check(); burst(L.checkX, 300, 16, 220); pop('Bandierina!', '#22b8a7'); }
  if (state==='play' && P.x >= L.finishX) finishLevel();
  if (state==='attract' && P.x > L.finishX - 100){ const order = [0,1,3,4,6,7]; startLevel(order[(order.indexOf(curLi)+1) % order.length], true); }
  if (state==='done'){
    doneT += dt;
    if (doneT < 2.5 && Math.random()<0.7) confetti();
    if (doneT > 1.4 && screens.done.hidden) showDone();
  }
  updateParts(dt);
  if (banner){ banner.time += dt; if (banner.time > 1.3) banner = null; }
  mSong = state==='attract' ? 'menu' : (LEVELS[curLi].theme==='mix' ? 'mix' : L.themes[0]);
}
function confetti(){ parts.push({x:camX+Math.random()*VW, y:-10, vx:(Math.random()-0.5)*60, vy:120+Math.random()*120, life:3.5, max:3.5, c:['#ffd23f','#ff6b4a','#22b8a7','#fff','#8f6bff'][Math.floor(Math.random()*5)], sz:7, k:'conf', r:Math.random()*6}); }
function addBlock(){
  const kind = pow.blocks > 0 ? 'mc' : 'lego';
  const bx = Math.floor((P.x - 6)/40)*40;
  for (const p of L.plats) if (p.brick && p.x === bx && p.y === P.lastGY) return p;
  const b = {x:bx, w:40, y:P.lastGY, y0:P.lastGY, s:-1, brick:kind, born:t, c:Math.floor(Math.random()*6)};
  L.plats.push(b); kind==='mc' ? sfx.block() : sfx.click();
  for (let i=0;i<4;i++) parts.push({x:bx+20, y:b.y+10, vx:(Math.random()-0.5)*120, vy:-Math.random()*150, life:0.4, max:0.4, c: kind==='mc' ? '#6dbb3c' : LEGO_COLS[b.c], sz:4, k:'cube'});
  return b;
}
function updateParts(dt){
  for (const q of parts){ q.x += q.vx*dt; q.y += q.vy*dt; if (q.k==='chunk'||q.k==='dot'||q.k==='cube') q.vy += 900*dt; q.life -= dt; if (q.r!==undefined) q.r += dt*5; }
  if (parts.length > 400) parts.splice(0, parts.length-400);
  parts = parts.filter(q=>q.life>0);
  for (const b of bubbles){ b.life -= dt; b.y -= 20*dt; }
  bubbles = bubbles.filter(b=>b.life>0);
  for (const p of pops){ p.life -= dt; p.y -= 60*dt; }
  pops = pops.filter(p=>p.life>0);
}

  {name:'Stella', c1:'#e63946', c2:'#ffd23f', coat:'#7a4a2c', mane:'#2a1a10'},

function drawPlatform(p, st){
  const sx = p.x - camX; if (sx > VW+20 || sx + p.w < -20) return;
  if (p.brick){
    const pop = Math.min(1, (t-p.born)*8);
    ctx.save(); ctx.translate(sx+20, p.y+20); ctx.scale(pop,pop);
    if (p.brick==='mc'){ ctx.imageSmoothingEnabled = false; ctx.drawImage(tile('grass', Math.floor(p.x/40)&3), -20,-20,40,40); }
    else legoBrick(-20,-20,40,24, LEGO_COLS[p.c], 2);
    ctx.restore(); return;
  }
  if (p.ghost){
    const on = pow.piano > 0, lit = p.lit && t - p.lit < 0.3;
    ctx.save(); ctx.globalAlpha *= on ? 1 : 0.3 + 0.1*Math.sin(t*4);
    ctx.fillStyle = lit ? '#ffe27a' : '#fff'; rr(sx, p.y, p.w, 26, 5); ctx.fill(); ctx.strokeStyle='#333'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='#222'; rr(sx+p.w*0.62, p.y, p.w*0.22, 15, 3); ctx.fill();
    if (!on){ ctx.setLineDash([6,6]); ctx.strokeStyle='#fff'; ctx.strokeRect(sx, p.y, p.w, 26); ctx.setLineDash([]); }
    ctx.restore(); return;
  }
  if (st==='mc') return platMC(p, sx);
  if (st==='lego') return platLego(p, sx);
  PLAT[p.th](p, sx);
}

function drawObst(o, st){

addEventListener('keydown', e=>{
  if (e.repeat) return;
  if (e.code==='Space' || e.code==='ArrowUp' || e.code==='KeyW'){ if (state==='play'){ e.preventDefault(); ensureAudio(); press(); } else if (state==='race'){ e.preventDefault(); raceTap(); } }
  if (e.code==='Escape' || e.code==='KeyP'){ if (state==='play' || state==='race') pauseGame(); else if (state==='paused' && !screens.pause.hidden) resumeGame(); }
});
addEventListener('keyup', e=>{ if (e.code==='Space' || e.code==='ArrowUp' || e.code==='KeyW') holding = false; });
document.addEventListener('visibilitychange', ()=>{ if (document.hidden) pauseGame(); });
cv.addEventListener('contextmenu', e=>e.preventDefault());

// ---------- boot ----------
startLevel(0, true); setTitle(); voiceLoadAll();
if (store.get('corri3-welcomed', false)) show('home'); else { buildWelcome(); show('welcome'); }
let last = performance.now();
function frame(now){
  const dt = Math.min(0.033, Math.max(0, (now-last)/1000)); last = now;
  update(dt); draw(); drawAvatarPreview(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
